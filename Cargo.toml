[package]
name = "nfl-analizer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "timeline"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# Plain `cargo run` (debug) still imports ~8M tracking rows quickly.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
