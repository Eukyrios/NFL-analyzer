<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060B16">
<title>NFL Play Viewer</title>
<style>
:root{--bg:#060B16;--surface:#0E1A2F;--raised:#15233D;--border:#1F3150;--muted:#8FA0BA;--text:#F3F6FB;--accent:#4F8CFF;--red:#E5322D;--green:#3FB950;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 50% -200px,#12305c 0,transparent 70%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:54px;padding:0 14px;background:rgba(6,11,22,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
#back{display:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;padding:0}
#back svg{width:18px;height:18px}
#title{font-size:16px;line-height:1.15;font-weight:650;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#err{margin-left:auto;font-size:12px;color:#ffb4b0}
#app{padding:14px 14px 40px;max-width:1100px;margin:0 auto}
.muted{color:var(--muted)}.small{font-size:12.5px}
h2{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 2px 8px;font-weight:650}
.ph{flex:none;position:relative;width:84px;height:84px}.ph img.hd{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;background:#EEF2F8;border:3px solid rgba(255,255,255,.9)}.ph .logo{position:absolute;right:-6px;bottom:-4px;border:2px solid #fff}
.logo{flex:none;border-radius:50%;background:#EEF2F8;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.logo img{width:84%;height:84%;object-fit:contain}
.logo.fb{color:#fff;font-weight:800;letter-spacing:.3px}
.hero{border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.hero .t1{font-size:25px;font-weight:750;line-height:1.1}.hero .t2{opacity:.85;margin-top:3px}
.hero .big{position:absolute;right:12px;top:6px;font-size:64px;font-weight:900;opacity:.1;line-height:1;pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px}.tile b{display:block;font-size:22px;font-weight:650;letter-spacing:-.2px}.tile span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin:14px 0 6px;position:sticky;top:62px;z-index:10}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--raised);color:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.list{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px 12px;min-height:56px;cursor:pointer;transition:background .12s,transform .08s}
.row:active{background:var(--raised);transform:scale(.99)}
.row .grow{flex:1;min-width:0}.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .chev{color:var(--muted);font-size:18px}
.jersey{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--raised);border:1px solid var(--border)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.snaps{font-variant-numeric:tabular-nums;font-weight:650;text-align:right}.snaps small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.wl{font-weight:800;font-size:13px;border-radius:8px;padding:4px 9px;min-width:68px;text-align:center;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:0 0 12px}
.card>b{display:block;margin-bottom:8px}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.bar .l{width:36%;min-width:90px;color:#dfe6f1}.bar .t{flex:1;background:var(--bg);border-radius:6px;height:14px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:6px}.bar .v{width:82px;text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
canvas{display:block;width:100%}
/* map */
#mapwrap{position:relative;width:100%;border-radius:20px;overflow:hidden;border:1px solid var(--border);background:radial-gradient(700px 400px at 50% 40%,#10233f,#0a1426);touch-action:none;user-select:none;-webkit-user-select:none}
#mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.st{fill:#1a2c4a;stroke:#0a1426;stroke-width:.9;transition:fill .15s}
.st.has{fill:#245096;cursor:pointer}.st.has:hover{fill:#2a54a0}.st.sel{fill:#3a74d8}
#mlogos{position:absolute;inset:0;pointer-events:none}
.ml{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transition:opacity .15s}
.ml .logo{border:2px solid rgba(255,255,255,.9)}
.ml.dim{opacity:.35}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:rgba(14,26,47,.92);font-size:20px;line-height:1;padding:0}
#hint{position:absolute;left:12px;top:10px;font-size:12.5px;color:var(--muted);background:rgba(6,11,22,.55);padding:4px 10px;border-radius:99px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--border);padding:9px 16px;border-radius:99px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.schip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:5px 14px 5px 6px;font-weight:600}
.schip .logo{box-shadow:none}
@media(max-width:520px){.score .tn{display:none}.score{padding:8px 10px}}
/* sheet */
#modal{position:fixed;inset:0;background:rgba(2,6,14,.6);z-index:30;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modal .box{background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 14px 22px;width:100%;max-width:520px;max-height:82vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modal .grab{width:42px;height:4px;border-radius:4px;background:var(--border);margin:2px auto 12px}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:22px;border-bottom:1px solid var(--border)}}
/* game */

body.maproute{overflow:hidden}
body.maproute #app{padding:0;max-width:none}
body.maproute #mapwrap{border-radius:0;border:0}
details.acc{margin:10px 0}
details.acc>summary,details.card>summary,.card details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;min-height:46px}
details.acc[open]>summary{margin-bottom:8px}
details>summary::-webkit-details-marker{display:none}
details.acc>summary::after,details>summary.sx::after{content:'▾';color:var(--muted,#8FA0BA);margin-left:8px}
details.acc[open]>summary::after{content:'▴'}
details.acc>summary small{margin-left:auto;color:#8FA0BA;font-weight:500}
.ctl2{display:flex;align-items:center;gap:8px;margin:10px 0}
.ctl2 .btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:46px;height:46px;font-size:17px;color:#fff;padding:0 12px}
.ctl2 .btn.play{background:var(--red);border-color:var(--red);min-width:64px}
.ctl2 label{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:8px 13px}
.ctl2 select{background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:12px;height:44px;padding:0 10px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0 4px}
.ctl .btn{background:var(--surface);border:1px solid var(--border);border-radius:12px;min-width:46px;height:44px;font-size:16px;padding:0 14px}
.ctl .btn.play{background:var(--red);border-color:var(--red);min-width:64px}
.ctl select{background:var(--surface);border:1px solid var(--border);color:#fff;border-radius:12px;height:44px;padding:0 10px;font-size:15px}
.ctl label{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:8px 13px}
.ctl input{width:17px;height:17px;accent-color:var(--accent)}
.score{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 14px;flex:1;min-width:0}
.score b.n{font-size:30px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
.sit{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px 14px;text-align:center;flex:1.2;min-width:0;display:flex;flex-direction:column;justify-content:center}
.sit b{font-size:18px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--raised);border:1px solid var(--border);border-radius:99px;padding:4px 12px;margin:0 6px 6px 0;font-size:12.5px}
.legend span{margin-right:14px;font-size:12.5px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div id="top"><button id="back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span id="title">NFL Play Viewer</span><span id="err"></span></div>
<div id="app"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>
<script src="data/meta.js"></script>
<script src="logos.js"></script>
<script src="usmap.js"></script>
<script src="heads.js"></script>
<script>
/*APP_JS*/
</script>
</body>
</html>
