[package]
name = "app"
version = "0.1.0"
edition = "2021"
description = "Native NFL dropback play viewer (egui/eframe)"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
nfl_core = { path = "../nfl_core" }
eframe.workspace = true
egui.workspace = true
egui_plot.workspace = true
image.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { workspace = true, features = ["android-native-activity"] }
winit = { version = "=0.30.13", features = ["android-native-activity"] }
log = "=0.4.27"
android_logger = "=0.15.0"

# cargo-apk metadata (see the README's "Native app" section).
[package.metadata.android]
package = "com.nflanalizer.app"
apk_name = "nfl-play-viewer"
assets = "assets"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "NFL Play Viewer"

[package.metadata.android.application.activity]
orientation = "landscape"
config_changes = "orientation|screenSize|keyboardHidden"
